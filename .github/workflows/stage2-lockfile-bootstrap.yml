name: Bootstrap Stage 2 Lockfile

# One-time branch-only bootstrap; remove this workflow once the reviewed lockfile exists.
on:
  push:
    branches:
      - feature/stage2-homepage-redesign
    paths:
      - package.json
      - .github/workflows/stage2-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'warasjawa-laundry/Mas' && github.ref == 'refs/heads/feature/stage2-homepage-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage2-homepage-redesign
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact versions in a lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Pin runtime and tooling dependencies to resolved versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const group of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[group] || {})) {
              const exact = lock.packages['node_modules/' + name]?.version;
              if (!exact) throw new Error('Unresolved version for ' + name);
              pkg[group][name] = exact;
            }
          }
          pkg.engines = {node: '24.x'};
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit branch-only lockfile and pins
        run: |
          if [ -n "$(git status --porcelain -- package.json package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "build(stage2): pin resolved dependencies and commit npm lockfile"
            git push origin HEAD:feature/stage2-homepage-redesign
          else
            echo "Lockfile and package versions already match."
          fi
