name: Mas Jawa Laundry Integration CI
on:
  push:
    branches: [integration/mas-jawa-laundry]
  pull_request:
    paths:
      - "app/admin/**"
      - "components/admin/amount-visit-form.tsx"
      - "supabase/migrations/**"
      - "app/k/**"
      - "app/membership/**"
      - "app/page.tsx"
      - "components/site-header.tsx"
      - "components/customer-card-scanner.tsx"
      - "app/globals.css"
      - "components/admin/**"
      - "app/k/**"
      - "tests/**"
      - ".github/workflows/stage7-whatsapp-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/stage4-progress.ui.spec.ts tests/stage5.ui.spec.ts tests/stage8.ui.spec.ts tests/public-member-entry.ui.spec.ts tests/stage9.ui.spec.ts
