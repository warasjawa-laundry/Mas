name: Bootstrap Stage 4 QR Lockfile
on:
  push:
    branches: [feature/stage4-member-card]
    paths: [.github/workflows/stage4-dependency-bootstrap.yml]
permissions:
  contents: write
jobs:
  pin:
    if: github.repository == 'warasjawa-laundry/Mas' && github.ref == 'refs/heads/feature/stage4-member-card'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage4-member-card
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Pin QR package versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const [group,name] of [['dependencies','qrcode'],['devDependencies','@types/qrcode']]){
            const version=lock.packages['node_modules/'+name]?.version;
            if(!version)throw new Error('Missing '+name);
            pkg[group][name]=version;
          }
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to stage4 only
        run: |
          if [ -n "$(git status --porcelain -- package.json package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "build(stage4): pin QR code dependencies"
            git push origin HEAD:feature/stage4-member-card
          fi
