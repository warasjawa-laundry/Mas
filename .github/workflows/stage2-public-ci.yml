name: Stage 2 Public Site

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/stage2-public-ci.yml"
  push:
    branches:
      - feature/stage2-homepage-redesign

permissions:
  contents: read

jobs:
  validate-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for viewport QA
        run: npx playwright install --with-deps chromium
      - name: Test mobile/desktop viewports and capture screenshots
        run: npm run test:ui
      - name: Preserve rendered screenshots for UX review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mas-jawa-stage2-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 7
