name: Stage 10 PostgreSQL Concurrency QA
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "lib/pos/**"
      - "lib/supabase/qa-preview-isolation.ts"
      - "tests/pos-*.test.mjs"
      - ".github/workflows/stage10-postgres-concurrency.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-db-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laundry_qa_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_dummy_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d laundry_qa_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: laundry_qa_ci
      PGUSER: postgres
      PGPASSWORD: ci_only_dummy_password
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Supabase Auth compatibility bootstrap (CI local only)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stage10-postgres-ci-bootstrap.sql
      - name: Replay all migrations in order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $(basename "$migration")"
            psql -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Database-only point policy ACL regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stage11-point-policy-privileges.sql
      - name: Transaction and role-isolation integration regressions
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/20261017_stage10_sql_integration_rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/20261017_stage10_role_isolation_rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stage15-foreign-key-indexes.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stage16-public-member-history.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stage18-service-catalog.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stage19-customer-import.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stage22-public-promotion-details.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-g2-schema-contract.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-single-outlet-passwordless-cashier.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-cashier-sequential-username-login.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-cashier-direct-id-login.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-g4-orders-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-g5-payment-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-g6-g6b-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-g7-qr-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-g7-member-name-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-owner-duration-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-owner-operations-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-import-audit-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pos-cashier-recovery-rollback.sql
      - name: Synthetic backup and restore rehearsal (no Production data)
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash supabase/tests/pos-synthetic-restore.sh
      - name: Canonical application schema metadata
        run: psql -XAt -v ON_ERROR_STOP=1 -f supabase/tests/pos-schema-fingerprint.sql > pos-schema-fingerprint.json
      - uses: actions/upload-artifact@v4
        with:
          name: pos-schema-fingerprint
          path: pos-schema-fingerprint.json
          retention-days: 7
      - name: Two independent connection concurrency tests
        run: |
          bash supabase/tests/stage10-postgres-parallel-race.sh
          bash supabase/tests/pos-g7-parallel-race.sh
          bash supabase/tests/pos-owner-parallel-race.sh
